<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Fakebot</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0f14;color:#e9eef6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    #boot{color:#9aa6b2;font-size:14px;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div id="boot" role="status">Opening Fakebot…</div>
  <script>window.__fakebotPacked="";</script>
  <script src="./fakebot-source/root-style-v6-01.js?v=20260729-voicing-style"></script>
  <script src="./fakebot-source/root-style-v6-02.js?v=20260729-voicing-style"></script>
  <script src="./fakebot-source/root-style-v6-03.js?v=20260729-voicing-style"></script>
  <script>
    (async()=>{
      const status=document.getElementById("boot");
      try{
        if(typeof DecompressionStream!=="function") throw new Error("This browser needs a newer version to open Fakebot.");
        const bytes=Uint8Array.from(atob(window.__fakebotPacked||""),char=>char.charCodeAt(0));
        const stream=new Blob([bytes],{type:"application/gzip"}).stream().pipeThrough(new DecompressionStream("gzip"));
        const markup=await new Response(stream).text();
        if(!/^<!doctype html/i.test(markup)) throw new Error("Fakebot source could not be restored.");
        document.open();
        document.write(markup);
        document.close();
      }catch(error){
        console.error(error);
        status.textContent=error.message||"Fakebot could not finish opening. Refresh once and try again.";
      }
    })();
  </script>
</body>
</html>
