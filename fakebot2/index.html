<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fakebot 2"/>
<meta name="theme-color" content="#0b0f14"/>
<title>🤖 fakebot 2</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14;color:#e9eef6;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .topbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top);height:34px;z-index:10;display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(5,8,12,.88);border-bottom:1px solid rgba(255,255,255,.09);backdrop-filter:blur(10px)}
  .topbar a{color:#e9eef6;text-decoration:none;font-size:12px;font-weight:900;padding:5px 8px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05)}
  .topbar span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9aa6b2;font-size:12px;font-weight:800}
  iframe{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 34px);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 34px);border:0;background:#0b0f14}
</style>
</head>
<body>
  <div class="topbar">
    <a href="../" aria-label="Open Fakebot Original">← v1</a>
    <span>fakebot 2 · feature-complete original, ready for refactor</span>
  </div>
  <iframe src="../index.html" title="Fakebot feature-complete app"></iframe>
</body>
</html>
